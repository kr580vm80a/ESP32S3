              const relY = Math.round((s.layoutY !== undefined ? s.layoutY : 0) - minLY);

              const assignedClient = kvmClients.find(c => c.mac.toLowerCase() === groupVal.toLowerCase() || c.name === groupNameVal);

              return {

                name: s.name,
                group: groupVal,
                groupName: groupNameVal,
                mac: macVal,
                x: relX,
                y: relY,
                width: s.width,
                height: s.height,

    canvas.addEventListener('mousedown', (e) => {

      const scaleCanvasY = canvas.height / (rect.height || 1);
      const mx = (e.clientX - rect.left) * scaleCanvasX;
      const my = (e.clientY - rect.top) * scaleCanvasY;

    canvas.addEventListener('mousemove', (e) => {

      }

      // Handle Drag & Drop
      if (isDragging && selectedScreen) {
        if (initialDetectedGroup.length > 0) {
          // --- Grouped Drag with Rigid Magnetic Alignment Guides (Layout Space) ---
          const anchor = initialDetectedGroup.find(g => g.id === selectedScreen.id);
          const anchorStartX = anchor ? anchor.startX : selectedScreen.x;
          const anchorStartY = anchor ? anchor.startY : selectedScreen.y;

          let rawDeltaCanvasX = (mx - dragStartX) - anchorStartX;
          let rawDeltaCanvasY = (my - dragStartY) - anchorStartY;

          // Use locked scale (same as draw()) for consistent coordinate mapping
          const activeScale = dragLockedScale !== null ? dragLockedScale : lastComputedScale;

          let deltaLayoutX = Math.round(rawDeltaCanvasX / activeScale);
          let deltaLayoutY = Math.round(-rawDeltaCanvasY / activeScale);

          snapGuides = [];
          const SNAP_LAYOUT_DIST = 120; // 120 layout units (~14px on canvas)
          const groupScreenIds = new Set(initialDetectedGroup.map(g => g.id));
          const externalScreens = screens.filter(s => !groupScreenIds.has(s.id));

          // Compute canvas transform parameters (same formula as draw())
          if (screens.length > 0) {
            const baseCanvasX = 20;
            const baseCanvasBottomY = canvas.height - 20;

            const minLayoutX = Math.min(...screens.map(s => s.layoutX !== undefined ? s.layoutX : 0));
            const minLayoutY = Math.min(...screens.map(s => s.layoutY !== undefined ? s.layoutY : 0));

            // Helper: convert layout coords to canvas pixel position (same as draw())
            function layoutToCanvasX(lx) {
              return baseCanvasX + Math.round((lx - minLayoutX) * activeScale);
            }
            function layoutToCanvasY(ly, h) {
              return baseCanvasBottomY - Math.round((ly - minLayoutY + h) * activeScale);
            }

            function addSnapGuide(type, layoutPos) {
              if (!snapGuides.some(g => g.type === type && Math.abs(g.layoutPos - layoutPos) <= 1)) {
                snapGuides.push({ type, layoutPos });
              }
            }

            for (let g of initialDetectedGroup) {
              const glx = g.startLayoutX + deltaLayoutX;
              const gly = g.startLayoutY + deltaLayoutY;
              const glw = g.screen.width;
              const glh = g.screen.height;

              // --- Snap to Global Bottom Baseline (y = 0) ---
              if (Math.abs(gly - 0) < SNAP_LAYOUT_DIST) {
                deltaLayoutY = 0 - g.startLayoutY;
                addSnapGuide('h', 0);
              }

              for (let other of externalScreens) {
                const olx = other.layoutX !== undefined ? other.layoutX : 0;
                const oly = other.layoutY !== undefined ? other.layoutY : 0;
                const olw = other.width;
                const olh = other.height;

                // Vertical snapping (X axis in exact layout units)
                if (Math.abs(glx - (olx + olw)) < SNAP_LAYOUT_DIST) {
                  deltaLayoutX = (olx + olw) - g.startLayoutX;
                  addSnapGuide('v', olx + olw);
                } else if (Math.abs((glx + glw) - olx) < SNAP_LAYOUT_DIST) {
                  deltaLayoutX = (olx - glw) - g.startLayoutX;
                  addSnapGuide('v', olx);
                } else if (Math.abs(glx - olx) < SNAP_LAYOUT_DIST) {
                  deltaLayoutX = olx - g.startLayoutX;
                  addSnapGuide('v', olx);
                } else if (Math.abs((glx + glw) - (olx + olw)) < SNAP_LAYOUT_DIST) {
                  deltaLayoutX = (olx + olw - glw) - g.startLayoutX;
                  addSnapGuide('v', olx + olw);
                }

                // Horizontal snapping (Y axis in exact layout units)
                if (Math.abs(gly - (oly + olh)) < SNAP_LAYOUT_DIST) {
                  deltaLayoutY = (oly + olh) - g.startLayoutY;
                  addSnapGuide('h', oly + olh);
                } else if (Math.abs((gly + glh) - oly) < SNAP_LAYOUT_DIST) {
                  deltaLayoutY = (oly - glh) - g.startLayoutY;
                  addSnapGuide('h', oly);
                } else if (Math.abs(gly - oly) < SNAP_LAYOUT_DIST) {
                  deltaLayoutY = oly - g.startLayoutY;
                  addSnapGuide('h', oly);
                } else if (Math.abs((gly + glh) - (oly + olh)) < SNAP_LAYOUT_DIST) {
                  deltaLayoutY = (oly + olh - glh) - g.startLayoutY;
                  addSnapGuide('h', oly + olh);
                }
              }
            }
          }

          let targetDeltaX = Math.round(deltaLayoutX * activeScale);
          let targetDeltaY = Math.round(-deltaLayoutY * activeScale);

          initialDetectedGroup.forEach(g => {
            g.screen.x = g.startX + targetDeltaX;
            g.screen.layoutX = g.startLayoutX + deltaLayoutX;
            g.screen.y = g.startY + targetDeltaY;
            g.screen.layoutY = g.startLayoutY + deltaLayoutY;
          });

    window.addEventListener('mouseup', () => {

        const scale = 0.12;
        if (screens.length > 0) {
          // Normalize baseline (0,0) without floating point scale division quantization error
          const minLayoutX = Math.min(...screens.map(s => s.layoutX !== undefined ? s.layoutX : Math.round((s.x - 50) / scale)));
          const minLayoutY = Math.min(...screens.map(s => s.layoutY !== undefined ? s.layoutY : 0));

          screens.forEach(s => {
            if (s.layoutX !== undefined) {
              s.layoutX -= minLayoutX;
            } else {
              s.layoutX = Math.round((s.x - 50) / scale) - minLayoutX;
            }
            if (s.layoutY !== undefined) {
              s.layoutY -= minLayoutY;
            } else {
              s.layoutY = 0;
            }
          });

          // --- Overlap Resolution: push overlapping monitors apart ---
          if (isDragging && selectedScreen) {
            let maxIterations = 20;
            while (maxIterations-- > 0) {
              let overlapFound = false;

              for (let i = 0; i < screens.length; i++) {
                for (let j = 0; j < screens.length; j++) {
                  if (i === j) continue;
                  const s1 = screens[i];
                  const s2 = screens[j];
                  if (s1.group && s2.group && s1.group === s2.group) continue;

                  const s1lx = s1.layoutX, s1ly = s1.layoutY;
                  const s1w = s1.width, s1h = s1.height;
                  const s2lx = s2.layoutX, s2ly = s2.layoutY;
                  const s2w = s2.width, s2h = s2.height;

                  const overlapX = s1lx < s2lx + s2w && s1lx + s1w > s2lx;
                  const overlapY = s1ly < s2ly + s2h && s1ly + s1h > s2ly;

                  if (overlapX && overlapY) {
                    overlapFound = true;

                    const isS1Dragged = s1.group === selectedScreen.group;

                    if (isS1Dragged) {
                      if (s1lx + s1w / 2 < s2lx + s2w / 2) {
                        const shift = (s1lx + s1w) - s2lx;
                        const s2Group = screens.filter(s => s.group === s2.group);
                        s2Group.forEach(s => s.layoutX += shift);
                      } else {
                        const shift = (s2lx + s2w) - s1lx;
                        const s1Group = screens.filter(s => s.group === s1.group);
                        s1Group.forEach(s => s.layoutX += shift);
                      }
                    } else {
                      if (s1lx >= s2lx) {
                        const shift = (s2lx + s2w) - s1lx;
                        const s1Group = screens.filter(s => s.group === s1.group);
                        s1Group.forEach(s => s.layoutX += shift);
                      } else {
                        const shift = (s1lx + s1w) - s2lx;
                        const s2Group = screens.filter(s => s.group === s2.group);
                        s2Group.forEach(s => s.layoutX += shift);
                      }
                    }

                    const curMinX = Math.min(...screens.map(s => s.layoutX));
                    const curMinY = Math.min(...screens.map(s => s.layoutY));
                    screens.forEach(s => {
                      s.layoutX -= curMinX;
                      s.layoutY -= curMinY;
                    });

        }

      isResizing = false;
      resizeScreen = null;

    function parseESP32ConfigResponse(jsonStr, expectedLen = -1) {
      try {
        if (!jsonStr || jsonStr.length < 2) {
          throw new Error('Empty or invalid CONFIG string received');
        }

        if (expectedLen > 0 && jsonStr.length !== expectedLen) {
          throw new Error(`Content-Length mismatch: received ${jsonStr.length} chars, expected ${expectedLen} chars`);
        }

        const doc = JSON.parse(jsonStr);
        if (!doc) return;

        let layoutsArr = [];
        if (doc.layouts && Array.isArray(doc.layouts)) {
          layoutsArr = doc.layouts;
        } else if (Array.isArray(doc)) {
          layoutsArr = [{ id: 'layout_1', name: 'Default Layout', screens: doc }];
        } else {
          return;
        }

        layoutsData = {
          activeLayoutId: doc.activeLayoutId || (layoutsArr[0] ? layoutsArr[0].id : 'layout_1'),
          layouts: layoutsArr.map((l, lIdx) => ({
            id: l.id || ('layout_' + (lIdx + 1)),
            name: l.name || ('Layout ' + (lIdx + 1)),
            screens: (l.screens || []).map((s, sIdx) => {
              const grp = s.group || 'manual';
              const grpName = s.groupName || 'Manual Group';
              const posX = (s.x !== undefined) ? s.x : (s.layoutX !== undefined ? s.layoutX : 0);
              const posY = (s.y !== undefined) ? s.y : (s.layoutY !== undefined ? s.layoutY : 0);
              const isDet = (s.isDetected !== undefined) ? s.isDetected : true;
              const isPrim = (s.isPrimary !== undefined) ? s.isPrimary : false;

              return {
                id: s.id || ('screen_' + Date.now() + '_' + sIdx),
                name: s.name || 'Display',
                group: grp,
                groupName: grpName,
                mac: s.mac || '',
                x: posX,
                y: posY,
                layoutX: posX,
                layoutY: posY,
                width: s.width || 1920,
                height: s.height || 1080,
                color: s.color || getGroupColor(grp),
                isDetected: isDet,
                isLocked: isDet,
                isPrimary: isPrim
              };
            })
          }))
        };

        if (doc.clients && Array.isArray(doc.clients)) {
          kvmClients = doc.clients;
        }

        if (doc.mouseMac || doc.boundMouseMac) {
          setBoundMouseStatus(doc.mouseMac || doc.boundMouseMac);
        }

        syncScreensReference();
        updateLayoutSelectorUI();
        renderClientsList();
        draw();
        configReceivedSuccessfully = true;
        console.log(`[PARSED CONFIG LOG] Restored explicit layout (${screens.length} screens across ${layoutsData.layouts.length} layouts):`, layoutsData);
      } catch(e) {
        console.warn('Failed to parse CONFIG response:', e);
        if (activeConnectionType === 'bluetooth' && !window.isRetryingConfig) {
          window.isRetryingConfig = true;
          console.log('[BLE READ RECOVERY] Packet dropped over the air. Auto-retrying GET_CONFIG in 350ms...');
          setTimeout(async () => {
            await sendESP32Command('GET_CONFIG\n');
            window.isRetryingConfig = false;
          }, 350);
        }
      }
    }

    let usbReadLoopActive = false;
    let usbReadBuffer = '';
    window.esp32SerialReader = null;

    async function startUsbReadLoop() {
      if (usbReadLoopActive || !window.esp32SerialPort || !window.esp32SerialPort.readable) return;
      usbReadLoopActive = true;
      console.log('[USB READ LOG] Started continuous USB Serial background read loop');

      try {
        while (window.esp32SerialPort && window.esp32SerialPort.readable && activeConnectionType === 'usb') {
          window.esp32SerialReader = window.esp32SerialPort.readable.getReader();
          try {
            while (activeConnectionType === 'usb') {
              const { value, done } = await window.esp32SerialReader.read();
              if (done) break;
              const chunkStr = new TextDecoder().decode(value);
              usbReadBuffer += chunkStr;

              if (usbReadBuffer.includes('\n')) {
                const lines = usbReadBuffer.split('\n');
                for (let i = 0; i < lines.length - 1; i++) {
                  const line = lines[i].trim();
                  if (line.length > 0) {
                    handleEsp32IncomingLine(line, 'USB');
                  }
                }
                usbReadBuffer = lines[lines.length - 1];
              }
            }
          } catch (readErr) {
            console.warn('[USB READ LOG] Stream read error / canceled:', readErr);
          } finally {
            if (window.esp32SerialReader) {
              try { window.esp32SerialReader.releaseLock(); } catch(e) {}
              window.esp32SerialReader = null;
            }
          }
        }
      } catch (err) {
        console.warn('[USB READ LOG] Serial read loop stopped:', err);
      } finally {
        usbReadLoopActive = false;
      }
    }

    function handleEsp32IncomingLine(line, source) {
      console.log(`[${source} INCOMING LOG] Line:`, line);

      if (line.startsWith('CONFIG ')) {
        const payload = line.substring(7).trim();
        let expectedLen = -1;
        let jsonStr = payload;

        // Check if payload starts with Content-Length header (e.g. "CONFIG 1822 {...}")
        const spaceIdx = payload.indexOf(' ');
        if (spaceIdx > 0 && !payload.startsWith('{') && !payload.startsWith('[')) {
          const lenHeader = payload.substring(0, spaceIdx);
          const parsedLen = parseInt(lenHeader, 10);
          if (!isNaN(parsedLen)) {
            expectedLen = parsedLen;
            jsonStr = payload.substring(spaceIdx + 1).trim();
          }
        }

        console.log(`[${source} CONFIG LOG] Received layout JSON from ESP32 (${jsonStr.length} chars, expected: ${expectedLen > 0 ? expectedLen : 'unspecified'}):`, jsonStr);
        parseESP32ConfigResponse(jsonStr, expectedLen);
      } else if (line.startsWith('MICE ')) {
        const jsonStr = line.substring(5);
        console.log(`[${source} MICE LOG] Received scanned mice from ESP32:`, jsonStr);
        renderScannedMiceList(jsonStr);
      } else if (line.startsWith('OK_BIND_MOUSE ')) {
        const mac = line.substring(14).trim();
        console.log(`[${source} BIND MOUSE] Target locked to ${mac}`);
        setBoundMouseStatus(mac);
      } else if (line.startsWith('OK_UNBIND_MOUSE')) {
        console.log(`[${source} UNBIND MOUSE] Target mouse lock cleared`);
        setBoundMouseStatus('');
      } else if (line.startsWith('TARGET_MOUSE ')) {
        const mac = line.substring(13).trim();
        setBoundMouseStatus(mac);
      } else if (line.startsWith('OK_SAVE')) {
        console.log(`[${source} SAVE LOG] ESP32 confirmed SAVE_CONFIG successful!`);
      }
    }

    let bleNotifyBuffer = '';

    function handleBleNotification(e) {
      const chunkStr = new TextDecoder('utf-8').decode(e.target.value);
      
      // If a new response header arrives over BLE while buffer holds un-terminated old data, flush the stale buffer!
      if (bleNotifyBuffer.length > 0 && (chunkStr.startsWith('CONFIG ') || chunkStr.startsWith('MICE ') || chunkStr.startsWith('OK_') || chunkStr.startsWith('TARGET_'))) {
        console.warn('[BLE NOTIFY FLUSH] Flushed un-terminated stale buffer:', bleNotifyBuffer.length, 'chars');
        bleNotifyBuffer = '';
      }

      bleNotifyBuffer += chunkStr;
      if (bleNotifyBuffer.includes('\n')) {
        const lines = bleNotifyBuffer.split('\n');
        for (let i = 0; i < lines.length - 1; i++) {
          const line = lines[i].trim();
          if (line.length > 0) {
            handleEsp32IncomingLine(line, 'BLE');
            if (window.onBleResponseCallback) {
              window.onBleResponseCallback(line);
            }
          }
        }
        bleNotifyBuffer = lines[lines.length - 1];
      }
    }

    async function ensureBleConnected() {
      if (!window.esp32BleDevice) return false;
      if (!window.esp32BleDevice.gatt.connected) {
        console.log('[BLE] Reconnecting GATT server...');
        window.esp32BleServer = await window.esp32BleDevice.gatt.connect();
        window.esp32BleService = await window.esp32BleServer.getPrimaryService(CONFIG_SERVICE_UUID);
        window.esp32BleRxChar = await window.esp32BleService.getCharacteristic(CONFIG_RX_UUID);
        window.esp32BleTxChar = await window.esp32BleService.getCharacteristic(CONFIG_TX_UUID);
        await window.esp32BleTxChar.startNotifications();
        window.esp32BleTxChar.addEventListener('characteristicvaluechanged', handleBleNotification);
        setConnectedStatus(true, 'Bluetooth Connected: ESP32 KVM Server');
      }
      return true;
    }

    let cmdWriteQueue = Promise.resolve();

    async function sendESP32Command(cmd) {
      console.log(`[SEND COMMAND LOG] (Channel: ${activeConnectionType}):`, cmd.trim());

      return new Promise((resolve) => {
        cmdWriteQueue = cmdWriteQueue.then(async () => {
          if (activeConnectionType === 'bluetooth' && window.esp32BleDevice && window.esp32BleRxChar) {
            await ensureBleConnected();
            bleNotifyBuffer = ''; // Reset notification buffer right before writing to GATT Rx
            const encoder = new TextEncoder();
            const data = encoder.encode(cmd);
            const chunkSize = 240; // High throughput payload chunk size supported by MTU-negotiated BLE
            for (let i = 0; i < data.length; i += chunkSize) {
              const chunk = data.slice(i, i + chunkSize);
              try {
                if (window.esp32BleRxChar.writeValueWithResponse) {
                  await window.esp32BleRxChar.writeValueWithResponse(chunk);
                } else if (window.esp32BleRxChar.writeValue) {
                  await window.esp32BleRxChar.writeValue(chunk);
                } else if (window.esp32BleRxChar.writeValueWithoutResponse) {
                  await window.esp32BleRxChar.writeValueWithoutResponse(chunk);
                }
              } catch(err) {
                console.warn('[BLE TX CHUNK RETRY] Retrying with writeValue:', err);
                try {
                  await window.esp32BleRxChar.writeValue(chunk);
                } catch(e2) {
                  console.error('[BLE TX CHUNK FAILED]:', e2);
                }
              }
              await new Promise(r => setTimeout(r, 15)); // Inter-packet delay for flow control
            }
            resolve(true);
          } else if (activeConnectionType === 'usb' && window.esp32SerialPort && window.esp32SerialPort.writable) {
            if (!window.esp32SerialPort || !window.esp32SerialPort.writable) {
              resolve(false);
              return;
            }
            try {
              const writer = window.esp32SerialPort.writable.getWriter();
              await writer.write(new TextEncoder().encode(cmd));
              writer.releaseLock();
              resolve(true);
            } catch (err) {
              console.error('[USB WRITE ERROR]:', err);
              resolve(false);
            }
          } else {
            console.warn(`[SEND COMMAND FAILED] Cannot send '${cmd.trim()}': activeConnectionType='${activeConnectionType}'`);
            resolve(false);
          }
        }).catch(() => resolve(false));
      });
    }

    let activeConnectionType = 'none'; // 'none', 'usb', or 'bluetooth'

    function updateConnectionUI(type) {
      activeConnectionType = type;

      const usbBtn = document.getElementById('btnConnectUSB');
      const btBtn = document.getElementById('btnConnectBT');
      const loadBtn = document.getElementById('btnLoadESP32');

      if (usbBtn) {
        if (type === 'usb') {
          usbBtn.classList.add('icon-btn-connected');
          usbBtn.title = 'USB Connected (Click to disconnect)';
        } else {
          usbBtn.classList.remove('icon-btn-connected');
          usbBtn.title = 'USB (Web Serial)';
        }
      }

      if (btBtn) {
        if (type === 'bluetooth') {
          btBtn.classList.add('icon-btn-connected');
          btBtn.title = 'Bluetooth Connected: ESP32 KVM Server (Click to disconnect)';
        } else {
          btBtn.classList.remove('icon-btn-connected');
          btBtn.title = 'Bluetooth BLE';
        }
      }

      const isConnected = (type === 'usb' || type === 'bluetooth');
      if (loadBtn) {
        loadBtn.disabled = !isConnected;
        loadBtn.style.opacity = isConnected ? '1.0' : '0.4';
        loadBtn.style.cursor = isConnected ? 'pointer' : 'not-allowed';
      }

      const mouseScanBtn = document.getElementById('btnScanBleMouse');
      if (mouseScanBtn) {
        mouseScanBtn.disabled = !isConnected;
        mouseScanBtn.style.opacity = isConnected ? '1.0' : '0.4';
        mouseScanBtn.style.cursor = isConnected ? 'pointer' : 'not-allowed';
      }
    }

    async function disconnectAllChannels() {
      activeConnectionType = 'none';

      if (window.esp32SerialReader) {
        try {
          await window.esp32SerialReader.cancel();
        } catch(e) {}
        try {
          window.esp32SerialReader.releaseLock();
        } catch(e) {}
        window.esp32SerialReader = null;
      }

      if (window.esp32SerialPort) {
        try {
          await window.esp32SerialPort.close();
        } catch (e) {
          console.warn('Error closing USB port:', e);
        }
        window.esp32SerialPort = null;
      }

      if (window.esp32BleDevice && window.esp32BleDevice.gatt && window.esp32BleDevice.gatt.connected) {
        try {
          window.esp32BleDevice.gatt.disconnect();
        } catch (e) {
          console.warn('Error disconnecting BLE GATT:', e);
        }
      }
      window.esp32BleDevice = null;
      window.esp32BleServer = null;
      window.esp32BleService = null;
      window.esp32BleRxChar = null;
      window.esp32BleTxChar = null;

      updateConnectionUI('none');
    }

    document.getElementById('btnConnectUSB').addEventListener('click', async () => {
      if (activeConnectionType === 'usb') {
        await disconnectAllChannels();
        console.log('[USB] Connection closed by user.');
        return;
      }

      await disconnectAllChannels();

      if ('serial' in navigator) {
        try {
          const port = await navigator.serial.requestPort();
          await port.open({ baudRate: 115200 });
          window.esp32SerialPort = port;
          
          port.addEventListener('disconnect', () => {
            console.warn('[USB] Serial port disconnected');
            updateConnectionUI('none');
          });

          updateConnectionUI('usb');
          startUsbReadLoop();
        } catch (err) {
          console.warn('USB connection canceled/failed:', err);
          updateConnectionUI('none');
        }
      } else {
        alert('Web Serial API is not supported in this browser.');
      }
    });

    document.getElementById('btnConnectBT').addEventListener('click', async () => {
      if (activeConnectionType === 'bluetooth') {
        await disconnectAllChannels();
        console.log('[BLE] Connection closed by user.');
        return;
      }

      await disconnectAllChannels();

      if ('bluetooth' in navigator) {
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [CONFIG_SERVICE_UUID, '12345678-1234-1234-1234-1234567890ab', 0x1812]
          });
          window.esp32BleDevice = device;
          device.addEventListener('gattserverdisconnected', () => {
            if (activeConnectionType === 'bluetooth') {
              console.warn('[BLE] GATT server disconnected unexpectedly');
            } else {
              console.log('[BLE] GATT server disconnected cleanly');
            }
            updateConnectionUI('none');
          });

          console.log('[BLE] Connecting to GATT server for device:', device.name);
          const server = await device.gatt.connect();

          let service;
          try {
            service = await server.getPrimaryService(CONFIG_SERVICE_UUID);
          } catch(serviceErr) {
            console.warn('[BLE] Config service not found:', serviceErr);
            alert('⚠️ Не знайдено Config Service на ESP32!\n\n1. Перевірте, що ви прошили плату через PlatformIO (Build 129+).\n2. Видаліть "ESP32 KVM Mouse" з налаштувань Bluetooth у Windows та підключіться знову, щоб оновити кеш.');
            updateConnectionUI('none');
            return;
          }

          window.esp32BleRxChar = await service.getCharacteristic(CONFIG_RX_UUID);
          window.esp32BleTxChar = await service.getCharacteristic(CONFIG_TX_UUID);

          await window.esp32BleTxChar.startNotifications();
          window.esp32BleTxChar.addEventListener('characteristicvaluechanged', handleBleNotification);

          updateConnectionUI('bluetooth');
        } catch (err) {
          console.error('[BLE Error]:', err);
          updateConnectionUI('none');
          alert('Failed to connect via Bluetooth: ' + err.message);
        }
      } else {
        alert('Web Bluetooth API is not supported in this browser.');
      }
    });

    function parseLayoutToScreens(layoutArray) {
      const scale = 0.12;
      const baseCanvasX = 50;

      // Smart Grid Snapping for imported JSON layout items (Fixes 1075->1080, 15->0, 1917->1920 on page reload)
      const items = layoutArray.map(item => {
        const w = item.width || ((item.x_max !== undefined && item.x_min !== undefined && item.x_max > item.x_min) ? (item.x_max - item.x_min) : 1920);
        const h = item.height || 1080;
        return {
          ...item,
          width: w,
          height: h,
          x: item.x !== undefined ? item.x : (item.x_min !== undefined ? item.x_min : 0),
          y: item.y !== undefined ? item.y : 0
        };
      });

      const SNAP_THRESHOLD = 45;

      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < items.length; i++) {
          for (let j = 0; j < items.length; j++) {
            if (i === j) continue;

            // Snap Y relative coordinates (Bottom-Left Origin Y)
            if (Math.abs(items[i].y - (items[j].y + items[j].height)) < SNAP_THRESHOLD) {
              items[i].y = items[j].y + items[j].height;
            } else if (Math.abs((items[i].y + items[i].height) - items[j].y) < SNAP_THRESHOLD) {
              items[i].y = items[j].y - items[i].height;
            } else if (Math.abs(items[i].y - items[j].y) < SNAP_THRESHOLD) {
              items[i].y = items[j].y;
            }

            // Snap X relative coordinates
            if (Math.abs(items[i].x - (items[j].x + items[j].width)) < SNAP_THRESHOLD) {
              items[i].x = items[j].x + items[j].width;
            } else if (Math.abs((items[i].x + items[i].width) - items[j].x) < SNAP_THRESHOLD) {
              items[i].x = items[j].x - items[i].width;
            } else if (Math.abs(items[i].x - items[j].x) < SNAP_THRESHOLD) {
              items[i].x = items[j].x;
            }
          }
        }
      }

      const minX = Math.min(...items.map(item => item.x));
      const minY = Math.min(...items.map(item => item.y));

      // Normalize baseline to 0,0
      items.forEach(item => {
        item.x -= minX;
        item.y -= minY;
      });

      const maxY = Math.max(...items.map(item => item.y + item.height));
      const baseCanvasBottomY = 120 + Math.round(maxY * scale);
      let currentX = baseCanvasX;

      return items.map((item, idx) => {
        const sw = item.width * scale;
        const sh = item.height * scale;

        let posX = baseCanvasX + Math.round(item.x * scale);
        let posY = baseCanvasBottomY - Math.round((item.y + item.height) * scale);

        currentX = Math.max(currentX + sw + 15, posX + sw + 15);

        const isDetected = !!(item.is_detected || (item.group && item.group !== 'manual'));
        const groupKey = item.group || (isDetected ? 'PC_DETECTED' : 'manual');
        const groupName = item.group_name || item.group || (isDetected ? 'Detected PC' : 'Manual Preset');
        const isPrimary = !!(item.is_primary || (item.name && item.name.includes('Primary')));

        return {
          id: Date.now() + idx,
          name: item.name || 'FHD (16:9)',
          group: groupKey,
          groupName: groupName,
          width: item.width,
          height: item.height,
          layoutX: item.x,
          layoutY: item.y,
          x: posX,
          y: posY,
          color: getGroupColor(groupKey),
          isDetected: isDetected,
          isLocked: isDetected,
          isPrimary: isPrimary
        };
      });
    }

    function initAppOnStartup() {
      document.title = `ESP32 Bluetooth KVM Switcher v${BUILD_VERSION} - Configuration Center`;
      const verElem = document.getElementById('appBuildVersion');
      if (verElem) verElem.textContent = 'v' + BUILD_VERSION;
      console.log(`[ESP32 KVM Switch] Web App Build v${BUILD_VERSION} initialized.`);
      resizeCanvas();
      loadSavedProjectState();
      updateLayoutSelectorUI();
      renderClientsList();
      draw();
      updateJSON();

      if (document.fonts) {
        document.fonts.ready.then(() => draw());
        document.fonts.addEventListener('loadingdone', () => draw());
      }
    }
    initAppOnStartup();
  </script>
