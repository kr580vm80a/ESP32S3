<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    const BUILD_VERSION = 240;
    document.write('<title>ESP32 Bluetooth KVM Switcher v' + BUILD_VERSION + ' - Configuration Center</title>');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-hover: rgba(51, 65, 85, 0.8);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #818cf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 2px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      padding: 3px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 500;
      width: 100%;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 8px;
      height: calc(100vh - 16px);
      max-height: calc(100vh - 16px);
      flex: 1;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      overflow-y: auto;
      padding-right: 2px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.15));
      border: 1px solid var(--primary);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0f172a;
      box-shadow: 0 0 16px var(--primary-glow);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      box-shadow: none;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .icon-btn-danger:hover {
      background: rgba(248, 113, 113, 0.15);
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.4);
    }

    .icon-btn-primary {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .icon-btn-connected {
      background: rgba(52, 211, 153, 0.18) !important;
      border-color: #34d399 !important;
      color: #34d399 !important;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.4) !important;
    }

    .icon-btn-connected:hover {
      background: rgba(52, 211, 153, 0.3) !important;
      color: #6ee7b7 !important;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.6) !important;
    }

    .icon-btn-primary:hover {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0f172a;
      box-shadow: 0 0 12px var(--primary-glow);
      transform: translateY(-1px);
    }

    .inline-rename-input {
      background: #0f172a;
      border: 2px solid #34d399;
      color: #34d399;
      font-weight: 700;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      font-family: 'Outfit', sans-serif;
      outline: none;
      box-shadow: 0 0 16px rgba(52, 211, 153, 0.5);
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .preset-item {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: default;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }

    .preset-item-clickable {
      cursor: pointer;
    }

    .preset-item-clickable:hover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
    }

    .preset-res {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
    }

    .preset-name {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .editor-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .editor-container .card {
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .canvas-wrapper {
      position: relative;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
    }

    #screenCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      cursor: default;
      touch-action: none;
    }

    #screenCanvas:active {
      cursor: grabbing;
    }

    .canvas-instructions {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: center;
    }

    .detected-info {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
      font-size: 11px;
      line-height: 1.3;
    }

    .detected-info span {
      font-weight: 600;
      color: var(--primary);
    }

    @media (max-width: 768px) {
      body {
        height: auto;
        max-height: none;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 6px;
      }
      .main-grid {
        grid-template-columns: 1fr;
        height: auto;
        max-height: none;
      }
      .sidebar {
        height: auto;
        overflow-y: visible;
      }
      .editor-container {
        height: auto;
      }
      .canvas-wrapper {
        min-height: 440px;
        height: 440px;
      }
      #screenCanvas {
        min-height: 440px;
        height: 440px;
      }
    }
  </style>
</head>
<body>

  <div class="main-grid">
    <!-- Sidebar Controls -->
    <div class="sidebar">
      
      <header>
        <div class="logo-container">
          <div>
            <h1>ESP32 Bluetooth KVM Switcher <span id="appBuildVersion" style="font-size: 10px; font-weight: 500; color: var(--primary); background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); padding: 1px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle;"><script>document.write('v' + BUILD_VERSION);</script></span></h1>
            <p style="font-size: 10px; color: var(--text-muted);">Smart Boundary Mouse & Keyboard Switcher</p>
          </div>
        </div>
      <!-- Multi-Screen Detection Card -->
      <div class="card">
        <div class="card-title">Auto Detect</div>
        <div style="margin-bottom: 8px;">
          <label style="font-size: 10px; color: #94a3b8; display: block; margin-bottom: 3px;">Computer Label / Group Name:</label>
          <input type="text" id="pcNameInput" style="width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; padding: 4px 8px; font-size: 12px;" placeholder="e.g. Lenovo Laptop, PC 1">
        </div>
        <div class="detected-info" id="detectBox">
          Detects connected displays from OS.
        </div>
        <button class="btn btn-secondary" id="btnAutoDetect" style="width: 100%;">
          <span>Detect</span>
        </button>
      </div>

    </div>

    <!-- Main Canvas & Editor Controls -->
    <div class="editor-container">
      <div class="card" style="flex: 1; display: flex; flex-direction: column;">
        <div class="card-title" style="justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: center;">
          <!-- Left: Connection Controls & Layout Selector -->
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;" id="layoutControlsContainer">
            
            <!-- Connection & Storage Toolbar Group -->
            <div style="display: flex; align-items: center; gap: 4px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 8px; padding: 2px 5px;">
              <!-- USB Icon Button -->
              <button class="icon-btn" id="btnConnectUSB" title="USB (Web Serial)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"></path><path d="M4.93 10.93l4.24 4.24"></path><path d="M19.07 10.93l-4.24 4.24"></path><rect x="9" y="14" width="6" height="8" rx="1"></rect><circle cx="12" cy="5" r="1"></circle></svg>
              </button>
              
              <!-- Bluetooth Icon Button -->
              <button class="icon-btn" id="btnConnectBT" title="Bluetooth BLE">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"></path></svg>
              </button>

              <!-- Material Icon Button: Scan BLE Mouse (Disabled when disconnected) -->
              <button class="icon-btn" id="btnScanBleMouse" disabled onclick="toggleBleMouseModal(event)" title="Scan & Bind BLE Mouse" style="opacity: 0.4; cursor: not-allowed;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 0-5 5v10a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z"></path><line x1="12" y1="6" x2="12" y2="10"></line></svg>
              </button>

              <!-- Load Configuration from ESP32 Button (Disabled when disconnected) -->
              <button class="icon-btn" id="btnLoadESP32" disabled title="Load configuration from ESP32" style="opacity: 0.4; cursor: not-allowed;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              </button>

              <!-- Save to ESP32 Flash Button -->
              <button class="icon-btn icon-btn-primary" id="btnSyncESP32" title="Save to ESP32 Flash">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
              </button>

              <!-- Backup Layout JSON to Device Button -->
              <button class="icon-btn" id="btnBackupJSON" title="Backup JSON to Device (PC / Mac / Android / iOS)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              </button>

              <!-- Restore Layout JSON from Device File Button -->
              <button class="icon-btn" id="btnRestoreJSON" title="Restore JSON from Device File">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              </button>

              <!-- Dump Flash Diagnostic Button -->
              <button class="icon-btn" id="btnDumpFlash" title="Dump Flash NVS Diagnostic (Print to Console)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </button>
              
              <!-- Hidden Native File Input for Cross-Platform Restore -->
              <input type="file" id="jsonFileInput" accept=".json,application/json" style="display: none;">
            </div>

            <div style="width: 1px; height: 18px; background: var(--border-color); margin: 0 2px;"></div>

            <span style="font-size: 12px; font-weight: 700; color: var(--primary);">Layout:</span>
            
            <div id="layoutSelectWrapper" style="display: inline-flex; align-items: center;">
              <select id="layoutSelect" onchange="switchLayout(this.value)" style="background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); color: #f8fafc; border-radius: 6px; padding: 2px 6px; font-size: 11px; font-weight: 600; cursor: pointer; height: 26px;">
                <!-- Populated dynamically -->
              </select>
            </div>

            <!-- Material Icon Button: Add Preset Screen Popover -->
            <div style="position: relative; display: inline-block;">
              <button class="icon-btn" id="btnPresetDropdown" onclick="togglePresetMenu(event)" title="Add Screen Preset">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line><line x1="12" y1="7" x2="12" y2="13"></line><line x1="9" y1="10" x2="15" y2="10"></line></svg>
              </button>

              <!-- Floating Presets Dropdown Menu -->
              <div id="presetMenu" style="display: none; position: absolute; top: 34px; left: 0; background: #0f172a; border: 1px solid var(--border-color); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); border-radius: 8px; width: 250px; max-height: 260px; overflow: hidden; z-index: 10000; padding: 4px;">
                <div class="preset-list" id="presetList" style="max-height: 252px; overflow-y: auto;">
                  <!-- Populated dynamically from PRESET_RESOLUTIONS -->
                </div>
              </div>
            </div>

            <!-- Material Icon Button: KVM Clients Popover -->
            <div style="position: relative; display: inline-block;">
              <button class="icon-btn" id="btnClientsDropdown" onclick="toggleClientsMenu(event)" title="KVM Clients (MAC)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              </button>

              <!-- Floating Clients Dropdown Menu -->
              <div id="clientsMenu" onclick="event.stopPropagation()" style="display: none; position: absolute; top: 34px; left: 0; background: #0f172a; border: 1px solid var(--border-color); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); border-radius: 8px; width: 360px; max-height: 340px; overflow: hidden; z-index: 10000; padding: 6px;">
                <div style="font-size: 11px; font-weight: 700; color: var(--primary); padding: 4px 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
                  <span>KVM Clients</span>
                  <div style="display: flex; align-items: center; gap: 4px;">
                    <button class="icon-btn" id="btnAddClient" onclick="addInlineClient()" title="Add Client" style="width: 22px; height: 22px;">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button class="icon-btn" onclick="toggleClientsMenu(event)" title="Close" style="width: 22px; height: 22px; color: #94a3b8;">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                  </div>
                </div>
                <div id="clientsList" class="preset-list" style="max-height: 280px; overflow-y: auto; overflow-x: hidden;"></div>
              </div>
            </div>

            <!-- Material Icon Buttons (Clean Muted Monochrome) -->
            <button class="icon-btn" onclick="addBlankLayout()" title="Add New Layout">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            
            <button class="icon-btn" onclick="duplicateCurrentLayout()" title="Duplicate Active Layout">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>

            <button class="icon-btn" onclick="startInlineLayoutRename()" title="Rename Active Layout">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>

            <button class="icon-btn icon-btn-danger" onclick="deleteCurrentLayout()" title="Delete Active Layout">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>

            <button class="icon-btn icon-btn-danger" onclick="clearScreens()" title="Clear Active Layout Screens">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>

        </div>

        <div class="canvas-wrapper">
          <canvas id="screenCanvas"></canvas>
        </div>
        <div class="canvas-instructions">Drag screens to position. Auto-detected screens move together as a fixed group and cannot be resized.</div>
      </div>
    </div>
  </div>

  <!-- Floating Bluetooth Binding Dropdown Menu (Direct Child of Body) -->
  <div id="btBindingMenu" onclick="event.stopPropagation()" style="display: none; position: fixed; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-radius: 10px; width: 320px; max-height: 320px; overflow: hidden; z-index: 100000; padding: 8px;">
    <div style="font-size: 11px; font-weight: 700; color: var(--primary); padding: 4px 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
      <span>Bind Client</span>
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="icon-btn icon-btn-danger" id="btnUnlinkMacHeader" onclick="unbindScreenMac()" title="Unbind / Disconnect MAC" style="width: 22px; height: 22px; color: #ef4444; display: none;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"></line><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </button>
        <button class="icon-btn" onclick="closeBtBindingMenu()" title="Close" style="width: 22px; height: 22px; color: #94a3b8;">✕</button>
      </div>
    </div>
    <div id="btBindingList" class="preset-list" style="max-height: 250px; overflow-y: auto;"></div>
  </div>

  <!-- Floating BLE Mouse Scanner Modal (Direct Child of Body) -->
  <div id="bleMouseModal" onclick="event.stopPropagation()" style="display: none; position: fixed; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-radius: 10px; width: 340px; max-height: 360px; overflow: hidden; z-index: 100000; padding: 8px;">
    <div style="font-size: 11px; font-weight: 700; color: var(--primary); padding: 4px 6px; border-bottom: 1px solid var(--border-color); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;">
      <span>Scan BLE Mice</span>
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="icon-btn" onclick="startBleMouseScan()" title="Rescan" style="width: 22px; height: 22px; color: #38bdf8;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <button class="icon-btn" onclick="closeBleMouseModal()" title="Close" style="width: 22px; height: 22px; color: #94a3b8;">✕</button>
      </div>
    </div>
    
    <div id="boundMouseStatus" style="display: none; font-size: 10px; padding: 6px 8px; margin-bottom: 6px; background: rgba(52, 211, 153, 0.12); border: 1px solid rgba(52, 211, 153, 0.3); border-radius: 6px; color: #34d399; justify-content: space-between; align-items: center;">
      <span id="boundMouseLabel" style="font-family: 'JetBrains Mono', monospace;">Bound: 00:00:00:00:00:00</span>
      <button class="icon-btn icon-btn-danger" onclick="unbindTargetMouse()" title="Unlock / Unbind" style="width: 20px; height: 20px; color: #ef4444;">✕</button>
    </div>

    <div id="bleMouseList" class="preset-list" style="max-height: 260px; overflow-y: auto;"></div>
  </div>

  <script>
    // --- KVM Clients Registry ---
    let kvmClients = [];

    function formatMacInput(input) {
      if (!input) return;

      const rawVal = input.value;
      const cursorStart = input.selectionStart || 0;

      // Count how many valid hex digits were before cursor
      const hexBeforeCursor = rawVal.slice(0, cursorStart).replace(/[^0-9a-fA-F]/g, '').length;

      // Extract clean hex digits (max 12)
      let hexDigits = rawVal.replace(/[^0-9a-fA-F]/g, '').toLowerCase();
      if (hexDigits.length > 12) hexDigits = hexDigits.slice(0, 12);

      // Build XX:XX:XX:XX:XX:XX
      let formatted = '';
      for (let i = 0; i < hexDigits.length; i++) {
        if (i > 0 && i % 2 === 0) formatted += ':';
        formatted += hexDigits[i];
      }

      input.value = formatted;

      // Calculate new caret position based on hex digit count
      let newCursorPos = 0;
      let currentHexCount = 0;

      for (let i = 0; i < formatted.length; i++) {
        if (formatted[i] !== ':') {
          currentHexCount++;
        }
        if (currentHexCount >= hexBeforeCursor) {
          newCursorPos = i + 1;
          break;
        }
      }

      if (hexBeforeCursor === 0) newCursorPos = 0;
      if (newCursorPos > formatted.length) newCursorPos = formatted.length;

      if (formatted[newCursorPos] === ':') {
        newCursorPos++;
      }

      try {
        input.setSelectionRange(newCursorPos, newCursorPos);
      } catch(err) {}
    }

    function handleMacKeyDown(e, idx) {
      if (e.key === 'Enter') {
        saveInlineClient(idx);
        return;
      }
      if (e.key === 'Escape') {
        cancelInlineClient(idx);
        return;
      }

      const input = e.target;
      if (!input) return;

      const key = e.key;

      // Overtype / Overwrite mode for hex digits (0-9, a-f, A-F)
      if (key.length === 1 && /[0-9a-fA-F]/.test(key)) {
        e.preventDefault();
        const char = key.toLowerCase();
        let val = input.value || "00:00:00:00:00:00";

        if (val.length < 17) {
          val = val.padEnd(17, '0');
        }

        let pos = input.selectionStart;
        if (pos >= 17) pos = 16;

        // Skip colon
        if (val[pos] === ':') {
          pos++;
        }
        if (pos >= 17) return;

        const arr = val.split('');
        arr[pos] = char;

        // Maintain colons at positions 2, 5, 8, 11, 14
        [2, 5, 8, 11, 14].forEach(i => { arr[i] = ':'; });

        input.value = arr.join('');

        let nextPos = pos + 1;
        if (nextPos < 17 && arr[nextPos] === ':') {
          nextPos++;
        }
        input.setSelectionRange(nextPos, nextPos);
        return;
      }

      // Overtype backspace mode
      if (key === 'Backspace') {
        let pos = input.selectionStart;
        if (pos === 0) return;

        e.preventDefault();
        let prevPos = pos - 1;
        let val = input.value;

        if (val[prevPos] === ':') {
          prevPos--;
        }
        if (prevPos < 0) return;

        const arr = val.split('');
        arr[prevPos] = '0';
        [2, 5, 8, 11, 14].forEach(i => { arr[i] = ':'; });

        input.value = arr.join('');
        input.setSelectionRange(prevPos, prevPos);
        return;
      }
    }

    function renderClientsList() {
      const container = document.getElementById('clientsList');
      if (!container) return;
      if (kvmClients.length === 0) {
        container.innerHTML = '<div style="font-size: 11px; color: var(--text-muted); padding: 6px;">No clients registered. Click Add...</div>';
        return;
      }

      container.innerHTML = kvmClients.map((c, idx) => {
        const connDot = c.connected ? '<span style="color: #34d399;" title="Connected">●</span>' : '<span style="color: #64748b;" title="Disconnected">○</span>';
        
        if (c.isEditing) {
          return `
            <div class="preset-item" style="display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 3px 4px; height: 34px; min-height: 34px; width: 100%; box-sizing: border-box; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; border-radius: 6px; overflow: hidden;">
              <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
                ${connDot}
                <input type="text" id="editMac_${idx}" value="${c.mac || ''}" placeholder="aa:bb:cc:dd:ee:ff" maxlength="17"
                  onkeydown="handleMacKeyDown(event, ${idx})"
                  oninput="formatMacInput(this)"
                  style="width: 120px; height: 24px; font-family: 'JetBrains Mono', monospace; font-size: 10px; background: #020617; border: 1px solid #334155; color: #38bdf8; border-radius: 4px; padding: 0 4px; outline: none; box-sizing: border-box;">
              </div>
              <input type="text" id="editName_${idx}" value="${c.name || ''}" placeholder="Client Name" 
                onkeydown="if(event.key==='Enter') saveInlineClient(${idx}); if(event.key==='Escape') cancelInlineClient(${idx});"
                style="flex: 1; height: 24px; font-size: 10px; background: #020617; border: 1px solid #334155; color: #f8fafc; border-radius: 4px; padding: 0 4px; outline: none; margin: 0 2px; box-sizing: border-box;">
              <div style="display: flex; align-items: center; gap: 2px; flex-shrink: 0;">
                <button class="icon-btn" onclick="saveInlineClient(${idx})" title="Save" style="width: 24px; height: 24px; color: #34d399;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
                <button class="icon-btn" onclick="cancelInlineClient(${idx})" title="Cancel" style="width: 24px; height: 24px; color: #ef4444;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
            </div>
          `;
        }

        return `
          <div class="preset-item" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 3px 6px; height: 34px; min-height: 34px; box-sizing: border-box;">
            <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
              ${connDot}
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--primary);">${c.mac}</span>
            </div>
            <div style="font-size: 11px; font-weight: 600; color: var(--text-main); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 4px;" title="${c.name || 'Unnamed'}">
              ${c.name || 'Unnamed'}
            </div>
            <div style="display: flex; align-items: center; gap: 2px; flex-shrink: 0;">
              <button class="icon-btn" onclick="editClient(${idx})" title="Edit" style="width: 24px; height: 24px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="icon-btn icon-btn-danger" onclick="deleteClient(${idx})" title="Delete" style="width: 24px; height: 24px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function addInlineClient() {
      cancelAllPendingClientEdits();
      kvmClients.push({ mac: '', name: '', connected: false, isEditing: true, isNew: true });
      renderClientsList();
      setTimeout(() => {
        const lastIdx = kvmClients.length - 1;
        const input = document.getElementById(`editMac_${lastIdx}`);
        if (input) input.focus();
      }, 50);
    }

    function editClient(idx) {
      if (!kvmClients[idx]) return;
      cancelAllPendingClientEdits();
      kvmClients[idx].isEditing = true;
      renderClientsList();
      setTimeout(() => {
        const input = document.getElementById(`editMac_${idx}`);
        if (input) {
          input.focus();
          formatMacInput(input);
        }
      }, 50);
    }

    function saveInlineClient(idx) {
      const c = kvmClients[idx];
      if (!c) return;
      const macInput = document.getElementById(`editMac_${idx}`);
      const nameInput = document.getElementById(`editName_${idx}`);
      if (!macInput || !nameInput) return;

      const newMac = macInput.value.toLowerCase().trim();
      const newName = nameInput.value.trim();

      if (!newMac) {
        alert('⚠️ Please enter a MAC address!');
        macInput.focus();
        return;
      }

      c.mac = newMac;
      c.name = newName || 'Unnamed';
      delete c.isEditing;
      delete c.isNew;

      renderClientsList();
      updateJSON();
    }

    function cancelInlineClient(idx) {
      const c = kvmClients[idx];
      if (!c) return;
      if (c.isNew) {
        kvmClients.splice(idx, 1);
      } else {
        delete c.isEditing;
      }
      renderClientsList();
    }

    function cancelAllPendingClientEdits() {
      let changed = false;
      for (let i = kvmClients.length - 1; i >= 0; i--) {
        const c = kvmClients[i];
        if (c.isEditing) {
          if (c.isNew) {
            kvmClients.splice(i, 1);
          } else {
            delete c.isEditing;
          }
          changed = true;
        }
      }
      if (changed) {
        renderClientsList();
      }
    }

    let activeBindingScreen = null;

    function openBtBindingMenu(screen, clientX, clientY) {
      const menu = document.getElementById('btBindingMenu');
      const container = document.getElementById('btBindingList');
      if (!menu || !container) return;

      activeBindingScreen = screen;
      const currentMac = screen.mac ? screen.mac.toLowerCase() : '';

      const btnUnlinkHeader = document.getElementById('btnUnlinkMacHeader');
      if (btnUnlinkHeader) {
        btnUnlinkHeader.style.display = currentMac ? 'inline-flex' : 'none';
      }

      let html = '';

      if (kvmClients.length === 0) {
        html += `<div style="font-size: 11px; color: var(--text-muted); padding: 6px;">No KVM Clients registered yet. Add clients in KVM Clients menu.</div>`;
      } else {
        html += kvmClients.map(c => {
          const isSelected = currentMac && c.mac.toLowerCase() === currentMac;
          const connDot = c.connected ? '<span style="color: #34d399;">●</span>' : '<span style="color: #64748b;">○</span>';

          return `
            <div class="preset-item preset-item-clickable" onclick="bindScreenToMac('${c.mac}')" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; ${isSelected ? 'background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.4);' : ''}">
              <div style="display: flex; align-items: center; gap: 6px;">
                ${connDot}
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--primary);">${c.mac}</span>
                <span style="font-size: 11px; font-weight: 600; color: var(--text-main);">${c.name || 'Unnamed'}</span>
              </div>
              ${isSelected ? '<span style="color: #38bdf8; font-weight: 700; font-size: 11px;">✓</span>' : ''}
            </div>
          `;
        }).join('');
      }

      container.innerHTML = html;

      window.justOpenedBtMenu = true;
      const menuWidth = 320;
      const menuHeight = 260;

      // Position exactly 12px to the right of the clicked Bluetooth icon
      let left = clientX + 12;
      let top = clientY - 10;

      if (left + menuWidth > window.innerWidth - 10) {
        // If constrained on the right, position to the left of the icon
        left = Math.max(10, clientX - menuWidth - 12);
      }

      if (top + menuHeight > window.innerHeight - 10) {
        top = Math.max(10, window.innerHeight - menuHeight - 10);
      }

      left = Math.max(10, left);
      top = Math.max(10, top);

      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      menu.style.display = 'block';
    }

    function closeBtBindingMenu() {
      const menu = document.getElementById('btBindingMenu');
      if (menu) menu.style.display = 'none';
      activeBindingScreen = null;
    }

    // --- BLE Mouse Scanner & Target Lock ---
    let boundTargetMouseMac = '';

    async function toggleBleMouseModal(e) {
      if (e) e.stopPropagation();
      if (activeConnectionType === 'none') {
        alert('⚠️ Будь ласка, спочатку підключіться до ESP32 через USB або Bluetooth!');
        return;
      }
      const modal = document.getElementById('bleMouseModal');
      if (!modal) return;

      if (modal.style.display === 'block') {
        modal.style.display = 'none';
      } else {
        const btn = document.getElementById('btnScanBleMouse');
        if (btn) {
          const rect = btn.getBoundingClientRect();
          modal.style.left = Math.max(10, rect.left) + 'px';
          modal.style.top = (rect.bottom + 6) + 'px';
        }
        modal.style.display = 'block';
        await sendESP32Command('GET_TARGET_MOUSE\n');
        startBleMouseScan();
      }
    }

    function closeBleMouseModal() {
      const modal = document.getElementById('bleMouseModal');
      if (modal) modal.style.display = 'none';
    }

    function startBleMouseScan() {
      const container = document.getElementById('bleMouseList');
      if (container) {
        container.innerHTML = `
          <div style="font-size: 11px; color: var(--primary); padding: 12px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.21-8.58"></path></svg>
            Scanning nearby Bluetooth mice (5s)...
          </div>
        `;
      }
      sendESP32Command('SCAN_MICE\n');
    }

    function renderScannedMiceList(jsonStr) {
      const container = document.getElementById('bleMouseList');
      if (!container) return;

      try {
        const mice = JSON.parse(jsonStr);
        if (!Array.isArray(mice) || mice.length === 0) {
          container.innerHTML = `<div style="font-size: 11px; color: var(--text-muted); padding: 10px; text-align: center;">No Bluetooth mice found nearby.<br><span style="font-size: 10px; color: #64748b;">Make sure your mouse is turned on & advertising.</span></div>`;
          return;
        }

        container.innerHTML = mice.map(m => {
          const isBound = boundTargetMouseMac && m.mac.toLowerCase() === boundTargetMouseMac.toLowerCase();
          const rssiText = m.rssi ? `${m.rssi} dBm` : '';

          return `
            <div class="preset-item" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 8px; ${isBound ? 'background: rgba(52, 211, 153, 0.15); border: 1px solid #34d399;' : ''}">
              <div style="display: flex; flex-direction: column; gap: 2px; overflow: hidden; flex: 1;">
                <div style="font-size: 11px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                  ${m.name || 'Bluetooth Mouse'}
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--primary);">${m.mac}</span>
                  <span style="font-size: 9px; color: #64748b;">${rssiText}</span>
                </div>
              </div>
              <div>
                ${isBound ? 
                  '<span style="font-size: 10px; font-weight: 700; color: #34d399; padding: 2px 6px; background: rgba(52, 211, 153, 0.2); border-radius: 4px;">✓ Bound</span>' : 
                  `<button class="btn btn-primary" onclick="bindTargetMouse('${m.mac}')" style="font-size: 10px; padding: 3px 8px; height: 24px;">Bind & Lock</button>`
                }
              </div>
            </div>
          `;
        }).join('');
      } catch(e) {
        console.warn('Failed to parse MICE json:', e);
        container.innerHTML = `<div style="font-size: 11px; color: #ef4444; padding: 8px;">Failed to parse scan response.</div>`;
      }
    }

    function bindTargetMouse(mac) {
      if (!mac) return;
      sendESP32Command(`BIND_MOUSE ${mac}\n`);
    }

    function unbindTargetMouse() {
      sendESP32Command(`UNBIND_MOUSE\n`);
    }

    function setBoundMouseStatus(mac) {
      boundTargetMouseMac = mac ? mac.toLowerCase().trim() : '';
      const statusDiv = document.getElementById('boundMouseStatus');
      const label = document.getElementById('boundMouseLabel');

      if (statusDiv && label) {
        if (boundTargetMouseMac) {
          label.textContent = `Target Locked: ${boundTargetMouseMac.toUpperCase()}`;
          statusDiv.style.display = 'flex';
        } else {
          statusDiv.style.display = 'none';
        }
      }
    }

    function bindScreenToMac(mac) {
      if (!activeBindingScreen) return;
      const targetGroup = activeBindingScreen.group;

      screens.forEach(s => {
        if (targetGroup ? (s.group === targetGroup) : (s.id === activeBindingScreen.id)) {
          s.mac = mac;
        }
      });

      closeBtBindingMenu();
      updateJSON();
      renderClientsList();
      draw();
    }

    function unbindScreenMac() {
      if (!activeBindingScreen) return;
      const targetGroup = activeBindingScreen.group;

      screens.forEach(s => {
        if (targetGroup ? (s.group === targetGroup) : (s.id === activeBindingScreen.id)) {
          delete s.mac;
        }
      });

      closeBtBindingMenu();
      updateJSON();
      renderClientsList();
      draw();
    }

    function deleteClient(idx) {
      const c = kvmClients[idx];
      if (!c) return;
      if (!confirm(`Delete client "${c.name}" (${c.mac})?`)) return;
      kvmClients.splice(idx, 1);
      renderClientsList();
      updateJSON();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderClientsList();
    });
    const COLOR_DETECTED = '#34d399'; // Base Emerald color for auto-detected screens
    const COLOR_MANUAL = '#38bdf8';   // Distinct Sky Blue for manually added screens
    const GROUP_COLORS = ['#34d399', '#38bdf8', '#a855f7', '#f43f5e', '#fbbf24', '#818cf8'];

    function getGroupColor(groupId) {
      if (!groupId || groupId === 'manual') return COLOR_MANUAL;
      let hash = 0;
      for (let i = 0; i < groupId.length; i++) {
        hash = groupId.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % GROUP_COLORS.length;
      return GROUP_COLORS[index];
    }

    // Device Identification for Multi-Computer KVM Layout (In-memory)
    let currentDeviceId = 'PC_' + Math.random().toString(36).substring(2, 7).toUpperCase();

    function isMobileOrTabletDevice() {
      const ua = (navigator.userAgent || '').toUpperCase();
      const platform = (navigator.platform || '').toUpperCase();
      const isAndroid = ua.includes('ANDROID') || (navigator.userAgentData && navigator.userAgentData.platform === 'Android');
      const isIOS = ua.includes('IPHONE') || ua.includes('IPAD') || ua.includes('IPOD') || (platform.includes('MACINTEL') && navigator.maxTouchPoints > 1);
      const isMobileUA = ua.includes('MOBI') || (navigator.userAgentData && navigator.userAgentData.mobile);
      return isAndroid || isIOS || isMobileUA;
    }

    function detectIPhoneModel(w, h, ratio) {
      const minDim = Math.min(w, h);
      const maxDim = Math.max(w, h);
      if (minDim === 430 && maxDim === 932) return 'iPhone 14 Pro Max / 15 Pro Max';
      if (minDim === 402 && maxDim === 874) return 'iPhone 16 Pro';

    function detectIPadModel(w, h) {

      if (minDim === 744 && maxDim === 1133) return 'iPad mini';
      if (minDim === 768 && maxDim === 1024) return 'iPad';

    async function getDetectedOSName() {
      const platform = (navigator.platform || '').toUpperCase();
      const rawUA = navigator.userAgent || '';
      const ua = rawUA.toUpperCase();
      const ratio = window.devicePixelRatio || 1;
      const sw = window.screen.width;
      const sh = window.screen.height;

      // 1. iOS Devices (iPhone / iPad)
      const isIPhone = ua.includes('IPHONE') || ua.includes('IPOD');
      const isIPad = ua.includes('IPAD') || (platform.includes('MACINTEL') && navigator.maxTouchPoints > 1);

      if (isIPhone) return detectIPhoneModel(sw, sh, ratio);
      if (isIPad) return detectIPadModel(sw, sh);

      // 2. Android Devices
      const isAndroid = ua.includes('ANDROID') || (navigator.userAgentData && navigator.userAgentData.platform === 'Android');
      if (isAndroid) {
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
          try {
            const hints = await navigator.userAgentData.getHighEntropyValues(['platform', 'model']);
            if (hints.model && hints.model.trim()) {
              const m = hints.model.trim();
              if (m.toUpperCase().startsWith('ANDROID')) return m;
              return `Android (${m})`;
            }
          } catch (e) {}
        }

        const match = rawUA.match(/Android\s+[^;]+;\s*([^;)]+)\s*(?:Build|\))/i);
        if (match && match[1]) {
          const modelStr = match[1].trim();
          if (modelStr && !modelStr.toLowerCase().includes('wv') && modelStr.length < 30) {
            if (modelStr.toUpperCase().startsWith('ANDROID')) return modelStr;
            return `Android (${modelStr})`;
          }
        }

        const isMobile = ua.includes('MOBI') || (navigator.userAgentData && navigator.userAgentData.mobile);
        return isMobile ? 'Android Smartphone' : 'Android Tablet';
      }

      // 3. Desktop OS Detection
      let osType = 'Windows';
      if (platform.includes('MAC') || ua.includes('MACINTOSH')) {
        osType = 'MacBook';
      } else if (platform.includes('WIN') || ua.includes('WINDOWS')) {
        osType = 'Windows';
      } else if (platform.includes('LINUX') || ua.includes('LINUX')) {
        osType = 'Linux';
      }

      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        try {
          const hints = await navigator.userAgentData.getHighEntropyValues(['platform', 'model']);
          if (hints.model && hints.model.trim()) {
            if (hints.platform === 'Windows' || osType === 'Windows') {
              return `Windows ${hints.model}`;
            } else if (hints.platform === 'macOS' || osType === 'MacBook') {
              return hints.model.includes('Mac') ? hints.model : `MacBook ${hints.model}`;
            }
            return `${osType} ${hints.model}`;
          }
        } catch (e) {}
      }

      if (osType === 'Windows') return 'Windows PC';
      if (osType === 'MacBook') return 'MacOS';
      return osType;
    }

    // Find closest standard preset for any dimension (tests logical, swapped, and DPR-scaled dimensions)
    function getClosestPresetResolution(w, h, ratio = 1) {
      let closest = { width: PRESET_RESOLUTIONS[0][0], height: PRESET_RESOLUTIONS[0][1], name: PRESET_RESOLUTIONS[0][2] };
      let minDiff = Infinity;

      const candidates = [
        { width: Math.round(w), height: Math.round(h) },
        { width: Math.round(h), height: Math.round(w) }
      ];
      if (ratio && ratio !== 1) {
        candidates.push({ width: Math.round(w * ratio), height: Math.round(h * ratio) });
        candidates.push({ width: Math.round(h * ratio), height: Math.round(w * ratio) });
      }

      candidates.forEach(c => {
        PRESET_RESOLUTIONS.forEach(([pw, ph, pname]) => {
          const diff = Math.hypot(pw - c.width, ph - c.height);
          if (diff < minDiff) {
            minDiff = diff;
            closest = { width: pw, height: ph, name: pname };
          }
        });
      });
      return closest;
    }

    // --- IndexedDB File Handle Storage Helpers ---
    const DB_NAME = 'ESP32KVM_Storage';
    const DB_STORE = 'handles';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getStoredFileHandle() {
      try {
        const db = await openDB();
        return await new Promise((resolve) => {
          const tx = db.transaction(DB_STORE, 'readonly');
          const req = tx.objectStore(DB_STORE).get('drive_handle');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function setStoredFileHandle(handle) {
      try {
        const db = await openDB();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, 'readwrite');
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
          tx.objectStore(DB_STORE).put(handle, 'drive_handle');
        });
      } catch (e) {
        console.warn('Failed to save file handle to IndexedDB:', e);
        return false;
      }
    }

    async function verifyFilePermission(fileHandle, readWrite = false) {
      const options = {};
      if (readWrite) options.mode = 'readwrite';
      try {
        if ((await fileHandle.queryPermission(options)) === 'granted') return true;
        if ((await fileHandle.requestPermission(options)) === 'granted') return true;
      } catch (e) {}
      return false;
    }

      const isMac = platform.includes('MAC');

            label: s.label,
            width: s.width,
            height: s.height,
            devicePixelRatio: s.devicePixelRatio,
            left: s.left,
            top: s.top,
            isPrimary: s.isPrimary,
            isInternal: s.isInternal
          })));

          let infoHtml = `🎯 <span>Detected ${detectedScreens.length} display(s) for ${currentDeviceName} (${osLabel}):</span><br>`;

          const parsed = detectedScreens.map((s, idx) => {
            const ratio = s.devicePixelRatio || window.devicePixelRatio || 1;
            const preset = getClosestPresetResolution(s.width, s.height, ratio);

            let labelName = s.label ? s.label.trim() : '';
            if (!labelName) {
              if (s.isInternal) {
                labelName = 'Internal Display';
              } else {
                labelName = `Display ${idx + 1}`;
              }
            }
            if (s.isPrimary && !labelName.includes('Primary')) {
              labelName += ' (Primary)';
            }

            return {
              original: s,
              index: idx,
              rawLeft: s.left,
              rawTop: s.top,
              width: preset.width,
              height: preset.height,
              ratio: ratio,
              label: labelName,
              isPrimary: !!s.isPrimary
            };
          });

          // Smart OS Display Edge Grid Snapping (Fixes 1075->1080, 15->0, 1917->1920 OS scaling jitter)
          const items = parsed.map(d => ({
            ...d,
            left: d.rawLeft,
            top: d.rawTop,
            right: d.rawLeft + d.width,
            bottom: d.rawTop + d.height
          }));

          const SNAP_THRESHOLD = 45; // Snap OS scaling jitter within 45px threshold

          for (let pass = 0; pass < 2; pass++) {
            for (let i = 0; i < items.length; i++) {
              for (let j = 0; j < items.length; j++) {
                if (i === j) continue;

                // X-Axis Grid Alignment (Left to Right, Left to Left, Right to Right)
                if (Math.abs(items[i].left - items[j].right) < SNAP_THRESHOLD) {
                  const shift = items[j].right - items[i].left;
                  items[i].left += shift;
                  items[i].right += shift;
                } else if (Math.abs(items[i].left - items[j].left) < SNAP_THRESHOLD) {
                  const shift = items[j].left - items[i].left;
                  items[i].left += shift;
                  items[i].right += shift;
                } else if (Math.abs(items[i].right - items[j].right) < SNAP_THRESHOLD) {
                  const shift = items[j].right - items[i].right;
                  items[i].left += shift;
                  items[i].right += shift;
                }

                // Y-Axis Grid Alignment (Top to Bottom, Bottom to Bottom, Top to Top)
                if (Math.abs(items[i].top - items[j].bottom) < SNAP_THRESHOLD) {
                  const shift = items[j].bottom - items[i].top;
                  items[i].top += shift;
                  items[i].bottom += shift;
                } else if (Math.abs(items[i].bottom - items[j].top) < SNAP_THRESHOLD) {
                  const shift = items[j].top - items[i].bottom;
                  items[i].top += shift;
                  items[i].bottom += shift;
                } else if (Math.abs(items[i].bottom - items[j].bottom) < SNAP_THRESHOLD) {
                  const shift = items[j].bottom - items[i].bottom;
                  items[i].top += shift;
                  items[i].bottom += shift;
                } else if (Math.abs(items[i].top - items[j].top) < SNAP_THRESHOLD) {
                  const shift = items[j].top - items[i].top;
                  items[i].top += shift;
                  items[i].bottom += shift;
                }
              }
            }
          }

          const minLeft = Math.min(...items.map(d => d.left));
          const minTop = Math.min(...items.map(d => d.top));
          const maxBottom = Math.max(...items.map(d => d.bottom));

          // Check if this computer group already exists in layout
          const existingGroupScreens = screens.filter(s => s.group === currentDeviceId);

          let anchorLayoutX = 0;
          let anchorLayoutY = 0;
          let preservedGroupName = currentDeviceName;

          // Read custom name typed into text input if present
          const customInputName = document.getElementById('pcNameInput') ? document.getElementById('pcNameInput').value.trim() : '';

          if (existingGroupScreens.length > 0) {
            // Group ALREADY EXISTS: preserve existing custom groupName if not empty
            const existingWithCustomName = existingGroupScreens.find(s => s.groupName && s.groupName.trim() !== '');
            if (existingWithCustomName && existingWithCustomName.groupName.trim() !== '') {
              preservedGroupName = existingWithCustomName.groupName.trim();
            } else if (customInputName !== '') {
              preservedGroupName = customInputName;
            }

            // Group ALREADY EXISTS: preserve bottom-left coordinates of lowest monitor
            anchorLayoutY = Math.min(...existingGroupScreens.map(s => s.layoutY !== undefined ? s.layoutY : 0));
            const lowestMonitors = existingGroupScreens.filter(s => (s.layoutY !== undefined ? s.layoutY : 0) === anchorLayoutY);
            anchorLayoutX = Math.min(...lowestMonitors.map(s => s.layoutX !== undefined ? s.layoutX : 0));
          } else {
            if (customInputName !== '') {
              preservedGroupName = customInputName;
            }
            // NEW GROUP: align with lowest Y coordinate rectangle across existing screens
            if (screens.length > 0) {
              anchorLayoutY = Math.min(...screens.map(s => s.layoutY !== undefined ? s.layoutY : 0));
              const maxX = Math.max(...screens.map(s => (s.layoutX !== undefined ? s.layoutX : 0) + s.width));
              anchorLayoutX = maxX + 60;
            } else {
              anchorLayoutX = 0;
              anchorLayoutY = 0;
            }
          }

          // Update pcNameInput text box to match preserved name
          const pcInput = document.getElementById('pcNameInput');
          if (pcInput) pcInput.value = preservedGroupName;

          // Remove old screens for currentDeviceId
          screens = screens.filter(s => s.group !== currentDeviceId);
          syncActiveLayoutScreens();

          parsed.forEach((d, idx) => {
            const item = items[idx];
            infoHtml += `• <b>${d.label}</b>: ${d.width}x${d.height} px<br>`;

            const rawRelX = item.left - minLeft;
            const rawRelY = maxBottom - item.bottom;

            const finalLayoutX = anchorLayoutX + rawRelX;
            const finalLayoutY = anchorLayoutY + rawRelY;

            screens.push({
              id: Date.now() + d.index,
              name: d.label,
              group: currentDeviceId,
              groupName: preservedGroupName,
              width: d.width,
              height: d.height,
              layoutX: finalLayoutX,
              layoutY: finalLayoutY,
              x: 0,
              y: 0,
              color: getGroupColor(currentDeviceId),
              isDetected: true,
              isLocked: true,
              isPrimary: !!d.isPrimary
            });
          });
          syncActiveLayoutScreens();

          // Synchronize canvas s.x and s.y for ALL screens in layout using global maxLayoutY baseline
          const scale = 0.12;
          const baseCanvasX = 50;
          const maxLayoutY = Math.max(...screens.map(s => (s.layoutY !== undefined ? s.layoutY : 0) + s.height));
          const baseCanvasBottomY = 120 + Math.round(maxLayoutY * scale);

          screens.forEach(s => {
            const ly = s.layoutY !== undefined ? s.layoutY : 0;
            const lx = s.layoutX !== undefined ? s.layoutX : Math.round((s.x - 50) / scale);
            s.x = baseCanvasX + Math.round(lx * scale);
            s.y = baseCanvasBottomY - Math.round((ly + s.height) * scale);
          });

          document.getElementById('detectBox').innerHTML = infoHtml;
          saveProjectState();
          draw();
          return;

        } catch (err) {
          console.warn('getScreenDetails permission denied or canceled:', err);
        }
      }

      // Fallback (If getScreenDetails fails, permission denied, or on Smartphone/Tablet)
      const ratio = window.devicePixelRatio || 1;
      const rawW = window.screen.width;
      const rawH = window.screen.height;
      const isMultiMonitor = window.screen.isExtended;

      console.log('[OS Fallback Raw Response]:', { width: rawW, height: rawH, devicePixelRatio: ratio, isExtended: isMultiMonitor, isMobile: isMobile });

      if (isMobile) {
        const physW = Math.round(rawW * ratio);
        const physH = Math.round(rawH * ratio);
        const preset = getClosestPresetResolution(rawW, rawH, ratio);

        const screenW = (preset && Math.abs(preset.width - physW) < 120) ? preset.width : (physW > 0 ? physW : rawW);
        const screenH = (preset && Math.abs(preset.height - physH) < 120) ? preset.height : (physH > 0 ? physH : rawH);

        document.getElementById('detectBox').innerHTML = `
          🎯 <span>Smartphone/Tablet (${osLabel}):</span><br>
          • Device: <b>${currentDeviceName}</b><br>
          • Screen Size: <b>${screenW} × ${screenH} px</b><br>
          • Viewport: <sup>${rawW}×${rawH} (DPR: ${ratio.toFixed(1)})</sup>
        `;

        const pcInput = document.getElementById('pcNameInput');
        if (pcInput) pcInput.value = currentDeviceName;

        screens = screens.filter(s => s.group !== currentDeviceId);

        screens.push({
          id: Date.now(),
          name: `${currentDeviceName}`,
          group: currentDeviceId,
          groupName: currentDeviceName,
          width: screenW,
          height: screenH,
          layoutX: 0,
          layoutY: 0,
          x: 60,
          y: 120,
          color: COLOR_DETECTED,
          isDetected: true,
          isLocked: true,
          isPrimary: true
        });

        const scale = 0.12;
        const baseCanvasX = 50;
        const maxLayoutY = Math.max(...screens.map(s => (s.layoutY !== undefined ? s.layoutY : 0) + s.height));
        const baseCanvasBottomY = 120 + Math.round(maxLayoutY * scale);

        screens.forEach(s => {
          const ly = s.layoutY !== undefined ? s.layoutY : 0;
          const lx = s.layoutX !== undefined ? s.layoutX : Math.round((s.x - 50) / scale);
          s.x = baseCanvasX + Math.round(lx * scale);
          s.y = baseCanvasBottomY - Math.round((ly + s.height) * scale);
        });

        saveProjectState();
        draw();
        return;
      }

      if (isMultiMonitor) {
        document.getElementById('detectBox').innerHTML = `
          🎯 <span>Detected 2 displays (${osLabel}):</span><br>
          • Primary: <b>${preset.width}x${preset.height} px</b><br>
          • Secondary: <b>1920x1080 px</b>
        `;

        screens = [
          {
            id: Date.now(),
            name: isMac ? 'MacBook Display (Primary)' : `${currentDeviceName} (Primary)`,
            group: currentDeviceId,
            groupName: currentDeviceName,
            width: preset.width,
            height: preset.height,
            x: 60,
            y: 140,
            color: COLOR_DETECTED,
            isDetected: true,
            isLocked: true
          },
          {
            id: Date.now() + 1,
            name: 'DELL P2425HE (Display 2)',
            group: currentDeviceId,
            groupName: currentDeviceName,
            width: 1920,
            height: 1080,
            x: 175,
            y: 20,
            color: COLOR_DETECTED,
            isDetected: true,
            isLocked: true
          }
        ];
      } else {
        document.getElementById('detectBox').innerHTML = `
          🎯 <span>Physical Resolution (${osLabel}):</span><br>
          • Device: <b>${currentDeviceName}</b><br>
          • Preset: <b>${preset.width} x ${preset.height} px</b>
        `;

        screens = [{
          id: Date.now(),
          name: isMac ? 'MacBook Display' : (currentDeviceName || 'DELL P2425HE'),
          group: currentDeviceId,
          groupName: currentDeviceName,
          width: preset.width,
          height: preset.height,
          x: 60,
          y: 120,
          color: COLOR_DETECTED,
          isDetected: true,
          isLocked: true
        }];
      }

      saveProjectState();
      draw();
    });

    function toggleClientsMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('clientsMenu');
      if (!menu) return;
      const isOpen = menu.style.display === 'block';
      if (isOpen) {
        cancelAllPendingClientEdits();
        menu.style.display = 'none';
      } else {
        menu.style.display = 'block';
      }
    }

    document.addEventListener('click', (e) => {

    function addScreen(name, width, height) {
      const menu = document.getElementById('presetMenu');
      if (menu) menu.style.display = 'none';
      const scale = 0.12;

      // Ensure preset standard resolution
      const preset = getClosestPresetResolution(width, height);

      // Calculate layout coordinates: place to the right of all existing screens at y=0 baseline
      let newLayoutX = 0;
      if (screens.length > 0) {
        newLayoutX = Math.max(...screens.map(s => (s.layoutX !== undefined ? s.layoutX : 0) + s.width)) + 60;
      }
      const newLayoutY = 0;

      const newScreen = {
        id: Date.now(),
        name: name,
        group: 'manual_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        groupName: '',
        width: preset.width,
        height: preset.height,
        layoutX: newLayoutX,
        layoutY: newLayoutY,
        x: 0,
        y: 0,
        color: COLOR_MANUAL,
        isDetected: false,
        isLocked: false
      };
      screens.push(newScreen);
      saveProjectState();
      updateJSON();
      draw();
    }

    function removeScreen(id) {
      const target = screens.find(s => s.id === id);
      if (!target) return;

      if ((target.isDetected || target.isLocked) && target.group) {
        // Delete all screens in this specific computer group
        screens = screens.filter(s => s.group !== target.group);
      } else if (target.isDetected || target.isLocked) {
        // Delete all un-grouped auto-detected screens
        screens = screens.filter(s => !(s.isDetected || s.isLocked));
      } else {
        // Delete only this specific manual screen
        screens = screens.filter(s => s.id !== id);
      }
      syncActiveLayoutScreens();

      if (selectedScreen && !screens.includes(selectedScreen)) {
        selectedScreen = null;
      }
      updateJSON();
      draw();
    }

    function clearScreens() {
      const active = getActiveLayout();
      active.screens = [];
      screens = [];
      selectedScreen = null;
      updateLayoutSelectorUI();
      updateJSON();
      draw();
    }

    function draw() {
      if (!canvas.width || canvas.width === 0 || !canvas.height || canvas.height === 0) {
        canvas.width = canvas.parentElement ? canvas.parentElement.clientWidth : 800;
        canvas.height = canvas.parentElement ? canvas.parentElement.clientHeight : 500;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Background
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Find Primary (or top-left fallback) screen for each computer group
      const primaryPerGroup = {};
      const topLeftPerGroup = {};
      const groups = [...new Set(screens.map(s => s.group).filter(Boolean))];
      groups.forEach(grp => {
        const grpScreens = screens.filter(s => s.group === grp && (s.isDetected || s.isLocked));
        if (grpScreens.length > 0) {
          const sortedGrp = [...grpScreens].sort((a, b) => a.y - b.y || a.x - b.x);
          topLeftPerGroup[grp] = sortedGrp[0];

          const primaryScreen = grpScreens.find(s => s.isPrimary || (s.name && s.name.includes('Primary')));
          primaryPerGroup[grp] = primaryScreen || sortedGrp[0];
        }
      });

      // Compute dynamic fitScale & viewport bounds so ALL screens fit 100% inside canvas
      let fitScale = 0.12;
      let baseCanvasX = 20;
      let baseCanvasBottomY = canvas.height - 20;

      if (screens.length > 0) {
        const minLX = Math.min(...screens.map(s => s.layoutX !== undefined ? s.layoutX : Math.round((s.x - 20) / 0.12)));
        const maxLX = Math.max(...screens.map(s => (s.layoutX !== undefined ? s.layoutX : Math.round((s.x - 20) / 0.12)) + s.width));
        const minLY = Math.min(...screens.map(s => s.layoutY !== undefined ? s.layoutY : 0));
        const maxLY = Math.max(...screens.map(s => (s.layoutY !== undefined ? s.layoutY : 0) + s.height));

        const spanLX = Math.max(maxLX - minLX, 1920);
        const spanLY = Math.max(maxLY - minLY, 1080);

        const marginX = 20;
        const marginY = 20;

        const scaleX = (canvas.width - marginX * 2) / spanLX;
        const scaleY = (canvas.height - marginY * 2) / spanLY;

        fitScale = Math.min(0.12, scaleX, scaleY);
        baseCanvasX = marginX;
        baseCanvasBottomY = canvas.height - marginY;
      }

      // Lock scale during drag so monitors don't change size while dragging
      if (isDragging && dragLockedScale !== null) {
        fitScale = dragLockedScale;
      } else {
        lastComputedScale = fitScale; // Remember actual scale for next drag start
      }
      const scale = fitScale;

      // Compute relative Cartesian bottom-left coordinates (0,0) baseline for labels
      const minLayoutX = screens.length > 0 ? Math.min(...screens.map(s => s.layoutX !== undefined ? s.layoutX : Math.round((s.x - baseCanvasX) / scale))) : 0;
      const minLayoutY = screens.length > 0 ? Math.min(...screens.map(s => s.layoutY !== undefined ? s.layoutY : 0)) : 0;

      // Draw Magnetic Snap Guide Lines (Full Canvas width & height using exact layout coordinates)
      snapGuides.forEach(g => {
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        if (g.type === 'v') {
          const cx = baseCanvasX + Math.round((g.layoutPos - minLayoutX) * scale);
          ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
        } else if (g.type === 'h') {
          const cy = baseCanvasBottomY - Math.round((g.layoutPos - minLayoutY) * scale);
          ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // Draw Screens
      screens.forEach(s => {
        const ly = s.layoutY !== undefined ? s.layoutY : 0;
        const lx = s.layoutX !== undefined ? s.layoutX : Math.round((s.x - baseCanvasX) / scale);

        // Auto-fit screen canvas coordinates when not actively dragging
        if (!isDragging) {
          s.x = baseCanvasX + Math.round((lx - minLayoutX) * scale);
          s.y = baseCanvasBottomY - Math.round((ly - minLayoutY + s.height) * scale);
        }

        const sw = s.width * scale;
        const sh = s.height * scale;
        const isDetected = s.isDetected || s.isLocked;
        const color = getGroupColor(s.group);

        const relX = Math.round(lx - minLayoutX);
        const relY = Math.round(ly - minLayoutY);

        // Shadow & Glow
        ctx.shadowColor = color;
        ctx.shadowBlur = (selectedScreen === s) ? 20 : 6;

        // Screen Body
        ctx.fillStyle = 'rgba(30, 41, 59, 0.85)';
        ctx.strokeStyle = color;
        ctx.lineWidth = (selectedScreen === s) ? 3 : 2;

        const borderRadius = Math.min(8, Math.floor(sw / 6), Math.floor(sh / 6));
        ctx.beginPath();
        ctx.roundRect(s.x, s.y, sw, sh, borderRadius);
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;

        // Screen Title & Details
        ctx.fillStyle = '#f8fafc';
        ctx.font = '600 13px "Outfit", system-ui, -apple-system, sans-serif';
        ctx.fillText(s.name, s.x + 14, s.y + 26);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '400 11px "JetBrains Mono", monospace';
        ctx.fillText(`${s.width}x${s.height} px`, s.x + 14, s.y + 44);

        // Line 3: Render Computer Name & Bluetooth Icon ONLY on Primary Monitor of group
        const isPrimaryScreen = s.isPrimary || (s.group && primaryPerGroup[s.group] === s);
        if (isPrimaryScreen && (s.groupName || s.group)) {
          const gName = s.groupName || s.group;

          // Extract last 3 pairs of MAC if available (e.g. 57:02:23)
          let macSuffix = '';
          if (s.mac && s.mac.includes(':')) {
            const parts = s.mac.split(':');
            if (parts.length >= 3) {
              macSuffix = ' (' + parts.slice(-3).join(':').toUpperCase() + ')';
            }
          }

          const fullLabel = gName + macSuffix;

          // Draw Link / Unlink Icon (Matching Screenshot 2)
          const iconX = s.x + 13;
          const iconY = s.y + 51;
          const hasMac = !!s.mac;
          const iconColor = hasMac ? '#38bdf8' : '#64748b';

          ctx.strokeStyle = iconColor;
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (hasMac) {
            // Connected Link Icon (Left icon in screenshot 2)
            ctx.beginPath();
            ctx.moveTo(iconX + 5, iconY + 2);
            ctx.lineTo(iconX + 7, iconY + 0);
            ctx.arcTo(iconX + 10, iconY + 3, iconX + 7, iconY + 6, 2.5);
            ctx.lineTo(iconX + 5, iconY + 4);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(iconX + 5, iconY + 5);
            ctx.lineTo(iconX + 3, iconY + 7);
            ctx.arcTo(iconX + 0, iconY + 4, iconX + 3, iconY + 1, 2.5);
            ctx.lineTo(iconX + 5, iconY + 3);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(iconX + 3, iconY + 6);
            ctx.lineTo(iconX + 7, iconY + 2);
            ctx.stroke();
          } else {
            // Unlinked / Broken Link Icon (Right icon in screenshot 2)
            ctx.beginPath();
            ctx.moveTo(iconX + 5, iconY + 2);
            ctx.lineTo(iconX + 7, iconY + 0);
            ctx.arcTo(iconX + 10, iconY + 3, iconX + 7, iconY + 6, 2.5);
            ctx.lineTo(iconX + 6, iconY + 5);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(iconX + 4, iconY + 4);
            ctx.lineTo(iconX + 3, iconY + 7);
            ctx.arcTo(iconX + 0, iconY + 4, iconX + 3, iconY + 1, 2.5);
            ctx.lineTo(iconX + 4, iconY + 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(iconX + 1, iconY + 1);
            ctx.lineTo(iconX + 9, iconY + 8);
            ctx.stroke();
          }

          // Store hit box for Bluetooth Icon click
          s.btIconHitBox = {
            x: s.x + 8,
            y: s.y + 46,
            w: 20,
            h: 20,
            screen: s
          };

          // Draw Label Text right next to Bluetooth Icon
          ctx.fillStyle = color;
          ctx.font = '600 11px "Outfit", system-ui, -apple-system, sans-serif';
          ctx.fillText(fullLabel, s.x + 26, s.y + 60);

          const textWidth = ctx.measureText(fullLabel).width;
          s.groupNameHitBox = {
            x: s.x + 26,
            y: s.y + 48,
            w: Math.max(60, textWidth),
            h: 18,
            group: s.group,
            currentName: gName
          };
        } else {
          s.groupNameHitBox = null;
          s.btIconHitBox = null;
        }

        // Bottom-Left Relative Coordinate Label (x, y)
        ctx.fillStyle = '#38bdf8';
        ctx.font = '600 11px "JetBrains Mono", monospace';
        ctx.fillText(`(${relX}, ${relY})`, s.x + 14, s.y + sh - 12);

        // --- Red Delete Button (Top Right Corner) ---
        // For auto-detected screens, show delete button ONLY on Primary screen of its group
        const showDeleteBtn = !isDetected || (s.group && primaryPerGroup[s.group] === s);

        if (showDeleteBtn) {
          const btnRadius = 11;
          const btnX = s.x + sw - 14;
          const btnY = s.y + 14;
          s.deleteBtn = { x: btnX, y: btnY, r: btnRadius };

          ctx.fillStyle = '#f87171';
          ctx.beginPath();
          ctx.arc(btnX, btnY, btnRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(btnX - 4, btnY - 4);
          ctx.lineTo(btnX + 4, btnY + 4);
          ctx.moveTo(btnX + 4, btnY - 4);
          ctx.lineTo(btnX - 4, btnY + 4);
          ctx.stroke();
        } else {
          s.deleteBtn = null;
        }

        // --- Resize Handle (Bottom Right Corner) - ONLY FOR MANUAL SCREENS ---
        if (!isDetected) {
          const handleSize = 12;
          const handleX = s.x + sw - handleSize;
          const handleY = s.y + sh - handleSize;
          s.resizeHandle = { x: handleX, y: handleY, w: handleSize, h: handleSize };

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(s.x + sw, s.y + sh - handleSize);
          ctx.lineTo(s.x + sw, s.y + sh);
          ctx.lineTo(s.x + sw - handleSize, s.y + sh);
          ctx.closePath();
          ctx.fill();
        } else {
          s.resizeHandle = null;
        }
      });

      updateJSON();
    }

    function updateJSON() {
      syncScreensReference();
      const activeLayout = getActiveLayout();
      const scale = 0.12;

      const config = {
        device: "ESP32-KVM-Switch",
        activeLayoutId: layoutsData.activeLayoutId,
        totalLayouts: layoutsData.layouts.length,
        layouts: layoutsData.layouts.map(l => {
          const sorted = [...l.screens].sort((a, b) => (a.layoutX !== undefined ? a.layoutX : a.x) - (b.layoutX !== undefined ? b.layoutX : b.x) || (b.layoutY !== undefined ? b.layoutY : b.y) - (a.layoutY !== undefined ? a.layoutY : a.y));

          const minLX = sorted.length > 0 ? Math.min(...sorted.map(s => s.layoutX !== undefined ? s.layoutX : Math.round((s.x - 20) / scale))) : 0;
          const minLY = sorted.length > 0 ? Math.min(...sorted.map(s => s.layoutY !== undefined ? s.layoutY : 0)) : 0;

          return {
            id: l.id,
            name: l.name,
